name: Publish to PyPI
# run-name gives the run a fixed title, e.g. "Publish lattica_query_src (publish=true)", so the auto-release CI can find the run it started and wait for it.
run-name: Publish ${{ inputs.package }} (publish=${{ inputs.publish }})${{ inputs.from_run_id && format(' from run {0}', inputs.from_run_id) || '' }}

on:
  workflow_dispatch:  # allows manual triggering
    inputs:
      package:
        description: 'Which package to publish'
        required: true
        type: choice
        options:
          - lattica_build_src
          - lattica_query_src
          - lattica_studio_src
      publish:
        description: 'Upload the wheel to PyPI and tag the release (off: only build it and keep it as a run artifact)'
        required: false
        type: boolean
        default: true
      source_ref:
        description: 'Commit, tag or branch to build and tag (default: the branch this runs on)'
        required: false
        type: string
        default: ''
      from_run_id:
        description: "Don't build: publish the wheel of this earlier build-only run, which built source_ref"
        required: false
        type: string
        default: ''

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.7.12"
  WHEEL_ARTIFACT: ${{ inputs.package }}-wheel

jobs:
  build:
    if: inputs.from_run_id == ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Build the wheel
        working-directory: ${{ inputs.package }}
        run: uv build --wheel --out-dir dist

      - name: Keep the wheel as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.WHEEL_ARTIFACT }}
          path: ${{ inputs.package }}/dist/*.whl
          if-no-files-found: error

  publish:
    needs: build
    # Also runs when build was skipped because the wheel comes from from_run_id.
    if: ${{ !cancelled() && inputs.publish && (needs.build.result == 'success' || (needs.build.result == 'skipped' && inputs.from_run_id != '')) }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - name: Check that from_run_id comes with source_ref
        if: inputs.from_run_id != '' && inputs.source_ref == ''
        run: |
          echo "::error::from_run_id needs source_ref, the commit that run built (the git tag goes on it)"
          exit 1

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0  # Fetch all history for tags

      - name: Download the wheel the build job made
        if: inputs.from_run_id == ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.WHEEL_ARTIFACT }}
          path: dist

      - name: Download the wheel run ${{ inputs.from_run_id }} made
        if: inputs.from_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.WHEEL_ARTIFACT }}
          path: dist
          run-id: ${{ inputs.from_run_id }}
          github-token: ${{ github.token }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Get package info
        id: pkg_info
        working-directory: ${{ inputs.package }}
        run: |
          VERSION=$(uv version --short)
          PACKAGE_NAME=$(uv version | awk '{print $1}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

      # The git tag below names this version, so the wheel must be of it too.
      - name: Check the wheel is this version
        env:
          VERSION: ${{ steps.pkg_info.outputs.version }}
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [[ ${#wheels[@]} -ne 1 || "$(basename "${wheels[0]}")" != *"-$VERSION-"* ]]; then
            echo "::error::Expected one wheel of version $VERSION, got: ${wheels[*]}"
            exit 1
          fi

      - name: Publish to PyPI using trusted publishing
        run: uv publish --verbose dist/*.whl

      # Add a git tag like pypi-lattica-studio-v0.5.0 to the released commit.
      - name: Create Git tag
        env:
          TAG: pypi-${{ steps.pkg_info.outputs.package_name }}-v${{ steps.pkg_info.outputs.version }}
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
