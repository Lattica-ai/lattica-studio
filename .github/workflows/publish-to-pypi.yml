name: Publish to PyPI

on:
  workflow_dispatch:  # allows manual triggering
    inputs:
      package:
        description: 'Which package to publish'
        required: true
        type: choice
        options:
          - lattica_build_src
          - lattica_studio_src

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch all history for tags

      - name: Resolve package directory
        id: resolve
        run: |
          PACKAGE="${{ github.event.inputs.package }}"
          echo "package_path=$PACKAGE" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Get package info
        id: pkg_info
        working-directory: ${{ steps.resolve.outputs.package_path }}
        run: |
          VERSION=$(uv version --short)
          PACKAGE_NAME=$(uv version | awk '{print $1}')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"

      - name: Build and publish to PyPI using trusted publishing
        working-directory: ${{ steps.resolve.outputs.package_path }}
        run: |
          uv build --wheel --out-dir dist
          uv publish --verbose dist/*.whl

      - name: Create Git tag
        uses: Lattica-ai/github-actions-templates/actions/create-git-tag@main
        with:
          tag_type: "pypi"
          target: "${{ steps.pkg_info.outputs.package_name }}"
          identifier: "v${{ steps.pkg_info.outputs.version }}"
          github_token: ${{ secrets.GITHUB_TOKEN }}
