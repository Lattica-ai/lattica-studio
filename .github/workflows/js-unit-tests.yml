name: JS query client unit tests

on:
  push:
    branches: ["main"]
    paths: ["lattica_query_src/**", ".github/workflows/js-unit-tests.yml"]
  pull_request:
    branches: ["main"]
    paths: ["lattica_query_src/**", ".github/workflows/js-unit-tests.yml"]

jobs:
  js-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: lattica_query_src
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lattica_query_src/package-lock.json

      # npm ci also builds dist/ (the package's prepare script).
      - name: Install the dependencies
        run: npm ci

      - name: Run the tests
        run: npm test -- --coverage
