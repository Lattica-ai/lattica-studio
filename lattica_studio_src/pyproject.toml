[project]
name = "lattica-studio"
version = "0.1.3"
description = "Lattica Studio"
authors = [
    {name = "LatticaAI Inc.", email = "support@lattica.ai"},
]
readme = "README.md"
license = "LicenseRef-LatticaAI-Evaluation"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
dependencies = [
    "lattica-query>=2.0.1",
    "lattica-build>=0.1.1",
    "pyyaml",
]

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
# Cross-repo dependencies (defined here so all members can reference them)
lattica-query = { path = "../../client/lattica_query_src", editable = true }
lattica-build = { path = "../lattica_build_src", editable = true }


[tool.setuptools.packages.find]
where = ["."]
include = ["lattica_studio*"]
exclude = ["lattica_studio.internal_demos*"]
